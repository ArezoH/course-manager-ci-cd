# ============================================
# Docker Compose — Course Manager Application
# Services: app (Spring Boot) + db (PostgreSQL)
# ============================================

services:
  # --- PostgreSQL Database ---
  db:
    image: postgres:16-alpine
    container_name: coursemanager-db
    environment:
      POSTGRES_DB: coursemanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # --- Spring Boot Application ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coursemanager-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/coursemanager
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

# --- Named volume for database persistence ---
volumes:
  postgres_data:

# --- Custom network for service communication ---
networks:
  app-network:
    driver: bridge